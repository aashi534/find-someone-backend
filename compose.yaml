services:
  postgres:
    image: postgres:17-alpine
    container_name: find-someone-postgres
    environment:
      POSTGRES_DB: find_someone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: find_someone_local
    ports:
      - "5432:5432"
    volumes:
      - find-someone-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d find_someone"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  find-someone-postgres:
